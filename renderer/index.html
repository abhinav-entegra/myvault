    <style>
      html, body { background: #0b0e0c; color: #ede9df; margin: 0; }
      #boot-fail {
        display: none; position: fixed; inset: 0; z-index: 999;
        align-items: center; justify-content: center; padding: 32px;
        background: #0b0e0c; font-family: system-ui, sans-serif;
      }
      #boot-fail .card {
        max-width: 520px; border: 1px solid rgb(216 178 92 / 0.3);
        border-radius: 20px; padding: 28px 32px; background: #131714;
      }
      #boot-fail h2 { margin: 0 0 8px; font-size: 18px; color: #eac97e; }
      #boot-fail p { margin: 0; font-size: 13px; line-height: 1.6; color: #a3a89e; word-break: break-word; }
    </style>

  </head>

  <body class="bg-vault-bg font-sans text-vault-text antialiased">

    <div id="root"></div>

    <div id="boot-fail" role="alert">
      <div class="card">
        <h2>Myvault is taking too long to start</h2>
        <p id="boot-fail-msg">The interface has not loaded. Press Ctrl+Shift+I to open DevTools and read the red Console error, then share it.</p>
      </div>
    </div>

    <script>
      (function () {
        function show(msg) {
          var el = document.getElementById("boot-fail");
          var p = document.getElementById("boot-fail-msg");
          if (p && msg) p.textContent = String(msg).slice(0, 400);
          if (el) el.style.display = "flex";
        }
        window.addEventListener("error", function (e) {
          show((e && e.message) || "A script failed to load.");
        });
        window.addEventListener("unhandledrejection", function (e) {
          show((e && e.reason && (e.reason.message || e.reason)) || "A startup task failed.");
        });
        setTimeout(function () {
          var r = document.getElementById("root");
          if (r && !r.firstChild) show(null);
        }, 12000);
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>

  </body>
