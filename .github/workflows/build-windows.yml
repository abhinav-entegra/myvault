name: Build Windows installer

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

# Omit aggressive concurrency — cancel-in-progress on same branch drops runs mid-step with
# "The operation was canceled" while npm ci may have already succeeded.

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      CI: true
      # Silence legacy Node 20 on Action runner deprecation until GitHub migrates infra
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      # node-gyp's bundled GYP imports distutils (removed from Python 3.12+). Pin 3.11 for CI.
      - name: Python 3.11 for node-gyp / electron-rebuild
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check Python (node-gyp)
        run: |
          python --version
          python -c "import distutils.version; print('distutils OK')"

      - name: Install build tools for node-gyp
        run: |
          pip install --upgrade setuptools
          npm install -g node-gyp@latest

      - name: Install dependencies
        run: |
          Write-Host "=== npm ci START $(Get-Date -Format o) ==="
          npm ci
          Write-Host "=== npm ci END $(Get-Date -Format o) ==="

      - name: Verify embedded Supabase ciphertext (committed)
        run: if (!(Test-Path "app/embed/supabase.embedded.cipher.json")) { throw "Missing app/embed/supabase.embedded.cipher.json — run npm run embed:supabase locally and commit." }

      - name: Rebuild native addons (electron — often 12–35 min on Windows; log may stall while cl.exe/link run)
        env:
          npm_config_loglevel: verbose
        run: |
          Write-Host "=== electron-rebuild START $(Get-Date -Format o) ==="
          npm run rebuild:native
          Write-Host "=== electron-rebuild END $(Get-Date -Format o) ==="

      - name: Build Vite renderer (required for renderer-dist)
        run: |
          Write-Host "=== vite build START $(Get-Date -Format o) ==="
          npm run build
          Write-Host "=== vite build END $(Get-Date -Format o) ==="

      - name: Verify app icon (electron-builder / rcedit need ≥256×256 PNG; committed assets, not regenerated)
        run: |
          node -e "const fs=require('fs'); const {PNG}=require('pngjs'); const png=PNG.sync.read(fs.readFileSync('app/icon.png')); console.log('app/icon.png', png.width+'x'+png.height); if(png.width<256||png.height<256) { console.error('Icon too small'); process.exit(1); }"

      - name: NSIS installer (electron-builder)
        run: |
          Write-Host "=== electron-builder START $(Get-Date -Format o) ==="
          npx electron-builder --win nsis --publish never
          Write-Host "=== electron-builder END $(Get-Date -Format o) ==="

      - name: Verify auto-update metadata (electron-updater needs latest.yml on the release)
        run: |
          if (!(Test-Path "dist/latest.yml")) { throw "Missing dist/latest.yml — electron-builder should emit this for GitHub Releases auto-update." }
          Get-ChildItem dist -Name

      - name: Upload installer artifact (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: myvault-windows-setup-${{ github.sha }}
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error

      - name: GitHub Release (tags v* only)
        if: >-
          github.event_name == 'push' &&
          startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: false
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/latest.yml
