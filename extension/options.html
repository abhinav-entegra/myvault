<!DOCTYPE html>

<html lang="en">

  <head>
    <meta charset="UTF-8" />

    <title>Myvault Browser Bridge</title>

    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none';"
    />

    <link rel="stylesheet" href="options.css" />

  </head>

  <body>
    <main class="panel">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 3l8 4v6c0 5-3.4 9.4-8 10-4.6-.6-8-5-8-10V7l8-4z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        </div>
        <div>
          <div class="eyebrow">Myvault browser bridge</div>
          <h1>Bring your vault into your flow.</h1>
        </div>
      </div>

      <p class="lead">
        Connect this browser once using the URL and token from Myvault’s Extension screen.
      </p>

      <label for="baseUrl">API base URL</label>

      <input id="baseUrl" autocomplete="off" />

      <label for="token">Bearer token</label>

      <input id="token" type="password" autocomplete="new-password" />

      <div class="row">

        <button id="save" type="button">Save connection</button>

        <button id="test" type="button" class="secondary">Test connection</button>

      </div>

      <p id="status" class="status" aria-live="polite"></p>

      <p class="hint">
        <strong>Private by design.</strong> Autofill starts from the toolbar icon or your configured shortcut.
      </p>

    </main>

    <script src="options.js" defer></script>

  </body>

</html>
